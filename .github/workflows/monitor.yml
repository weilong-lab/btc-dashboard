# 后台监控在 GitHub 上跑：Mac 关机也继续。
# 每段跑约 55 分钟（抓新闻、AI 判断、盘面异常、模拟盘、模型喊单、持仓提醒，每分钟一轮），
# 状态每 10 分钟存到 monitor-state 分支，下一段接着跑。每 30 分钟排一次，同一时间只跑一段，
# 前一段没结束时下一段排队等，所以基本是连续的（GitHub 定时任务高峰时可能晚几分钟）。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里设置：
#   DEEPSEEK_API_KEY  新闻 AI 判断（没有就用关键词规则）
#   RECORDS_TOKEN     细粒度令牌，只勾 btc-records，Contents 读写（读人工喊单、写提醒给 Muse）
name: 后台监控

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "只检查各数据源能不能连上（不运行后台）"
        type: boolean
        default: false

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ inputs.diagnose }}
    runs-on: ubuntu-latest
    steps:
      - name: 检查数据源
        run: |
          for u in \
            "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=2" \
            "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=5m&limit=2" \
            "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=5m&limit=2" \
            "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=5m&limit=2" \
            "https://www.okx.com/api/v5/public/open-interest?instId=BTC-USDT-SWAP" \
            "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=5&limit=2" \
            "https://api.hyperliquid.xyz/info" \
            "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=5m&limit=2" \
            "https://contract.mexc.com/api/v1/contract/kline/BTC_USDT?interval=Min5" \
            "https://api.bitget.com/api/v2/mix/market/candles?symbol=BTCUSDT&productType=usdt-futures&granularity=5m&limit=2" ; do
            code=$(curl -s -o /tmp/r -w "%{http_code}" -m 15 "$u"); echo "$code  $u  $(head -c 120 /tmp/r)"; done

  run:
    if: ${{ !inputs.diagnose }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: 安装依赖
        run: pip install -r monitor/requirements.txt

      - name: 取回上一段的状态
        run: |
          mkdir -p monitor/out
          if git fetch --depth 1 origin monitor-state 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C monitor/out
            ls -la monitor/out
          else
            echo "还没有保存过状态，从头开始"
          fi

      - name: 运行约 55 分钟
        working-directory: monitor
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAVE_STATE: "1"
          RECORDS_REPO: weilong-lab/btc-records
          RECORDS_TOKEN: ${{ secrets.RECORDS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAC_NOTIFY: "0"
          MARKET_SOURCE: cloud          # 美国服务器连不上币安合约：K 线用币安公开行情镜像，持仓量 / 资金费率用 OKX
          DISPLAY_TZ: Asia/Tokyo
          PYTHONWARNINGS: ignore
        run: python monitor.py --minutes 55 --no-push
